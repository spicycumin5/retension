# Render Blueprint for the free setup: one free web service (API + frontend).
# The database is Neon (free) and the hourly reminder job runs on GitHub Actions
# (.github/workflows/digest.yml), so nothing here is billed.
# Free Render services can't make outbound SMTP connections, so the site sends its emails
# (verification, password reset) through Brevo's HTTPS API instead of Gmail.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: retension
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_BACKEND
        value: brevo
      # Set these in the dashboard when prompted:
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: FRONTEND_URL # e.g. https://recall-xxxx.onrender.com
        sync: false
      - key: EMAIL_FROM # e.g. Retension <you@gmail.com>
        sync: false
      - key: BREVO_API_KEY # Brevo -> SMTP & API -> API keys
        sync: false
