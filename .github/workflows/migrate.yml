# Applies database migrations when they change on main. Vercel has no startup step to run them
# in, unlike the Docker image, which runs them before starting the server.
name: Database migrations

on:
  push:
    branches: [main]
    paths: ["backend/alembic/**"]
  workflow_dispatch: # "Run workflow" button, e.g. for the first deploy

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
