# Sends the daily reminder emails. Runs hourly; each user gets theirs once
# their local time passes their chosen hour, so a late run still delivers.
name: Daily reminder emails

on:
  schedule:
    - cron: "17 * * * *" # off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch: # "Run workflow" button for testing

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secrets can't be read in a job-level `if`, so check for them here first.
  # Until DATABASE_URL is set, runs pass quietly instead of failing every hour.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add the repo secrets listed in the README (Deploy for free) to start sending reminders."
          fi

  send:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      # Brevo's API key keeps working when the Google password changes; Gmail app passwords don't.
      EMAIL_BACKEND: brevo
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # The job never signs tokens, so it doesn't need the app's SECRET; settings just require one.
      - run: echo "SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: python -m app.jobs.send_digests
